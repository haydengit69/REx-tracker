<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>REx: Reincarnated - Logs & Ore Comp</title>
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #161922;
      --border-color: #2a2e3d;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green-bg: rgba(35, 165, 90, 0.15);
      --green-border: #23a55a;
      --red-bg: rgba(237, 66, 69, 0.15);
      --red-border: #da373c;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .nav-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 900px;
    }

    .nav-btn {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      background-color: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
    }

    .nav-btn.active {
      background-color: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .config-box {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      padding: 16px 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-sizing: border-box;
      align-items: flex-end;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    input {
      padding: 10px 14px;
      font-size: 14px;
      background-color: #0b0c10;
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 6px;
      outline: none;
    }

    button.action-btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      height: 38px;
    }

    .doc-page {
      background: var(--card-bg);
      width: 100%;
      max-width: 900px;
      min-height: 600px;
      padding: 35px 40px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-sizing: border-box;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border-bottom: 1px solid var(--border-color);
      padding: 12px 14px;
      text-align: left;
      font-size: 14px;
    }

    .status-banner {
      background: #1c3b5e;
      border: 1px solid #4752c4;
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .comp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }

    .comp-card {
      padding: 14px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-sizing: border-box;
      transition: transform 0.1s ease;
    }

    .comp-card.found {
      background-color: var(--green-bg);
      border: 1px solid var(--green-border);
    }

    .comp-card.missing {
      background-color: var(--red-bg);
      border: 1px solid var(--red-border);
    }

    .comp-name {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }

    .comp-detail {
      font-size: 12px;
      color: var(--text-muted);
    }

    .comp-badge {
      display: inline-block;
      align-self: flex-start;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .comp-card.found .comp-badge {
      background: var(--green-border);
      color: #fff;
    }

    .comp-card.missing .comp-badge {
      background: var(--red-border);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <button class="nav-btn active" onclick="switchTab('logs')">Ore Finding Logs</button>
    <button class="nav-btn" onclick="switchTab('comp')">Ore Comp</button>
  </div>

  <div class="config-box">
    <div class="input-group">
      <label for="usernameInput">Roblox Username</label>
      <input type="text" id="usernameInput" placeholder="Enter username...">
    </div>
    <button class="action-btn" onclick="executeSearch()">Search Logs & Ore Comp</button>
  </div>

  <div class="doc-page">
    <div id="tab-logs" class="tab-content active">
      <h1 id="docTitle">Ore Findings Report</h1>
      <table>
        <thead>
          <tr>
            <th>Ore Name</th>
            <th>Rarity / Layer</th>
            <th>Blocks Mined</th>
            <th>Date Found</th>
          </tr>
        </thead>
        <tbody id="resultsBody">
          <tr>
            <td colspan="4" style="text-align:center; color: var(--text-muted); padding: 30px;">Enter a Roblox username to query findings.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div id="tab-comp" class="tab-content">
      <h1>Ore Comp (Exotic+)</h1>
      <div id="compStatus" class="status-banner">Status: Ready to query player findings.</div>
      <div id="compContainer" class="comp-grid"></div>
    </div>
  </div>

  <script>
    // Index of Exotic and higher tiered items in REx: Reincarnated
    const EXOTIC_PLUS_DATABASE = [
      { name: "Astatine", rarity: "1 in 250,000", tier: "Exotic", layer: "Layer 4", world: "Overworld" },
      { name: "Aetherion", rarity: "1 in 500,000", tier: "Exotic", layer: "Layer 5", world: "Overworld" },
      { name: "Antimatter", rarity: "1 in 1,000,000", tier: "Exotic", layer: "Layer 5", world: "Overworld" },
      { name: "Absolute Everything", rarity: "1 in 5,000,000", tier: "Exotic", layer: "Core", world: "Overworld" },
      { name: "Abyssal Gem", rarity: "1 in 7,500,000", tier: "Exotic", layer: "Abyss", world: "Sub-Surface" },
      { name: "Astral Processor", rarity: "1 in 12,000,000", tier: "Exotic", layer: "Layer 6", world: "Overworld" },
      { name: "Auroral Singularity", rarity: "1 in 25,000,000", tier: "Exotic", layer: "Boreal Peak", world: "Overworld" },
      { name: "Aether", rarity: "1 in 50,000,000", tier: "Exotic", layer: "Sky Realm", world: "Overworld" },
      { name: "Auraverse", rarity: "1 in 100,000,000", tier: "Exotic", layer: "Deep Layers", world: "Overworld" },
      { name: "Chronos", rarity: "1 in 250,000,000", tier: "Exotic", layer: "Time Rift", world: "Dimensional" },
      { name: "Celestialite", rarity: "1 in 500,000,000", tier: "Exotic", layer: "Cosmosphere", world: "Outer Space" },
      { name: "Cataclysmium", rarity: "1 in 1,000,000,000", tier: "Exotic", layer: "Core Trench", world: "Overworld" },
      { name: "Continuum Rift", rarity: "1 in 2,500,000,000", tier: "Exotic", layer: "Void", world: "Unknown" },
      { name: "Cosmic Treasure", rarity: "1 in 5,000,000,000", tier: "Exotic", layer: "Deep Space", world: "Outer Space" },
      { name: "DOOMSDAY", rarity: "1 in 10,000,000,000", tier: "Exotic", layer: "Endtimes", world: "Sub-Surface" },
      { name: "Dynamo of Fate", rarity: "1 in 50,000,000,000", tier: "Exotic", layer: "Final Layer", world: "Overworld" }
    ];

    let playerFoundOres = new Set();

    function switchTab(tabName) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tabName === 'logs') {
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        document.getElementById('tab-logs').classList.add('active');
      } else {
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
        document.getElementById('tab-comp').classList.add('active');
      }
    }

    function renderOreComp() {
      const container = document.getElementById('compContainer');
      const statusBanner = document.getElementById('compStatus');
      container.innerHTML = '';

      let foundCount = 0;

      EXOTIC_PLUS_DATABASE.forEach(ore => {
        const isFound = playerFoundOres.has(ore.name.toLowerCase());
        if (isFound) foundCount++;

        const card = document.createElement('div');
        card.className = `comp-card ${isFound ? 'found' : 'missing'}`;

        card.innerHTML = `
          <div class="comp-name">${ore.name}</div>
          <div class="comp-detail"><strong>Rarity:</strong> ${ore.rarity}</div>
          <div class="comp-detail"><strong>Layer:</strong> ${ore.layer}</div>
          <div class="comp-detail"><strong>World:</strong> ${ore.world}</div>
          <div class="comp-badge">${isFound ? 'UNLOCKED' : 'LOCKED'}</div>
        `;

        container.appendChild(card);
      });

      statusBanner.innerHTML = `<strong>Completion Progress:</strong> ${foundCount} / ${EXOTIC_PLUS_DATABASE.length} Exotics+ Unlocked (${Math.round((foundCount / EXOTIC_PLUS_DATABASE.length) * 100)}%)`;
    }

    async function executeSearch() {
      const username = document.getElementById('usernameInput').value.trim();
      if (!username) {
        alert("Please enter a username.");
        return;
      }

      const resultsBody = document.getElementById('resultsBody');
      resultsBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color: var(--text-muted); padding: 30px;">Querying database for ${username}...</td></tr>`;

      // Simulating findings retrieval and updating local cache
      playerFoundOres.clear();
      
      // Example populated state for testing/demo
      playerFoundOres.add("astatine");
      playerFoundOres.add("antimatter");
      playerFoundOres.add("cataclysmium");

      // Update UI log results table
      resultsBody.innerHTML = `
        <tr>
          <td>Astatine</td>
          <td>1 in 250,000 (Layer 4)</td>
          <td>1,420,110</td>
          <td>2026-05-12</td>
        </tr>
        <tr>
          <td>Antimatter</td>
          <td>1 in 1,000,000 (Layer 5)</td>
          <td>4,891,002</td>
          <td>2026-06-01</td>
        </tr>
        <tr>
          <td>Cataclysmium</td>
          <td>1 in 1,000,000,000 (Core Trench)</td>
          <td>89,120,400</td>
          <td>2026-07-20</td>
        </tr>
      `;

      // Render updated visual cards
      renderOreComp();
    }

    // Initialize layout on load
    renderOreComp();
  </script>
</body>
</html>
