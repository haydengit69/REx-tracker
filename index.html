<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>REx: Reincarnated - Ore Tracker & Ore Comp</title>
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #161922;
      --border-color: #2a2e3d;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green-bg: rgba(35, 165, 90, 0.2);
      --green-text: #23a55a;
      --red-bg: rgba(237, 66, 69, 0.2);
      --red-text: #da373c;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .nav-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 1100px;
    }

    .nav-btn {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      background-color: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
    }

    .nav-btn.active {
      background-color: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .config-box {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      width: 100%;
      max-width: 1100px;
      background: var(--card-bg);
      padding: 16px 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-sizing: border-box;
      align-items: flex-end;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      padding: 10px 14px;
      font-size: 14px;
      background-color: #0b0c10;
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    button.action-btn {
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
      height: 38px;
    }

    button.action-btn:hover {
      background-color: var(--accent-hover);
    }

    .doc-page {
      background: var(--card-bg);
      width: 100%;
      max-width: 1100px;
      min-height: 800px;
      padding: 35px 40px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-sizing: border-box;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      color: #fff;
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border-bottom: 1px solid var(--border-color);
      padding: 12px 14px;
      text-align: center;
      vertical-align: middle;
      font-size: 14px;
    }

    th {
      background-color: rgba(255, 255, 255, 0.02);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .row-hover {
      position: relative;
    }

    .row-hover:hover {
      background-color: rgba(255, 255, 255, 0.03);
    }

    /* Tooltip */
    .tooltip {
      visibility: hidden;
      width: 280px;
      background-color: #0b0c10;
      color: #fff;
      text-align: left;
      border-radius: 8px;
      padding: 12px 14px;
      position: absolute;
      z-index: 100;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 1px solid var(--border-color);
      box-shadow: 0px 10px 25px rgba(0,0,0,0.5);
      font-size: 12px;
      line-height: 1.6;
      pointer-events: none;
    }

    .row-hover:hover .tooltip {
      visibility: visible;
    }

    .tooltip div {
      margin-bottom: 3px;
    }

    .tooltip span {
      color: var(--text-muted);
      font-weight: 600;
    }

    /* 3-Column Layer Grid Layout */
    .layers-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 20px;
    }

    @media (max-width: 900px) {
      .layers-grid {
        grid-template-columns: 1fr;
      }
    }

    .layer-card {
      background: #0b0c10;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .layer-card-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      margin-bottom: 12px;
      text-align: center;
    }

    .mini-table {
      width: 100%;
      border-collapse: collapse;
    }

    .mini-table th {
      padding: 6px 8px;
      font-size: 11px;
      text-align: center;
    }

    .mini-table td {
      padding: 8px;
      font-size: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
      vertical-align: middle;
    }

    .cell-found {
      color: var(--green-text);
      font-weight: 700;
    }

    .cell-missing {
      color: var(--red-text);
      font-weight: 700;
    }

    /* Rarity Badge Styles */
    .rarity-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .tier-Common { background: #2b2d31; color: #b9bbbe; border: 1px solid #4f545c; }
    .tier-Uncommon { background: #1b3a2b; color: #57f287; border: 1px solid #23a55a; }
    .tier-Rare { background: #1c3b5e; color: #5865f2; border: 1px solid #4752c4; }
    .tier-Master { background: #3c235a; color: #9b59b6; border: 1px solid #8e44ad; }
    .tier-Surreal { background: #4a154b; color: #e91e63; border: 1px solid #c2185b; }
    .tier-Mythic { background: #5c1d24; color: #ed4245; border: 1px solid #da373c; }
    .tier-Exotic { background: #5a3a00; color: #faa81a; border: 1px solid #fee75c; box-shadow: 0 0 8px rgba(254, 231, 92, 0.2); }
    .tier-Exquisite { background: #004d40; color: #1abc9c; border: 1px solid #16a085; box-shadow: 0 0 8px rgba(26, 188, 156, 0.2); }
    .tier-Transcendent { background: #003366; color: #00d2ff; border: 1px solid #00d2ff; box-shadow: 0 0 10px rgba(0, 210, 255, 0.3); }
    .tier-Enigmatic { background: #3d0066; color: #d000ff; border: 1px solid #d000ff; box-shadow: 0 0 10px rgba(208, 0, 255, 0.3); }
    .tier-Unfathomable { background: #660033; color: #ff007f; border: 1px solid #ff007f; box-shadow: 0 0 12px rgba(255, 0, 127, 0.4); }
    .tier-Otherworldly { background: #1a0033; color: #a855f7; border: 1px solid #c084fc; box-shadow: 0 0 12px rgba(192, 132, 252, 0.4); }
    .tier-Imaginary { background: #002b36; color: #2aa198; border: 1px solid #859900; box-shadow: 0 0 14px rgba(42, 161, 152, 0.5); }
    .tier-Zenith { background: linear-gradient(135deg, #ff0055, #7a00ff); color: #fff; border: 1px solid #ff7700; box-shadow: 0 0 15px rgba(255, 0, 85, 0.6); }
    .tier-Special { background: #34495e; color: #ecf0f1; border: 1px solid #bdc3c7; }

    .status-banner {
      background: #1c3b5e;
      border: 1px solid #4752c4;
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <button class="nav-btn active" onclick="switchTab('logs')">Ore Tracker</button>
    <button class="nav-btn" onclick="switchTab('comp')">Ore Comp</button>
  </div>

  <div class="config-box">
    <div class="input-group">
      <label for="usernameInput">Roblox Username</label>
      <input type="text" id="usernameInput" placeholder="Enter username...">
    </div>
    <button class="action-btn" onclick="executeSearch()">Search Logs</button>
  </div>

  <div class="doc-page">
    <!-- Ore Tracker Tab -->
    <div id="tab-logs" class="tab-content active">
      <h1 id="docTitle">Ore Findings Report</h1>
      <table>
        <thead>
          <tr>
            <th>Ore Name</th>
            <th>Rarity Tier</th>
            <th>Blocks Mined</th>
            <th>Date Found</th>
          </tr>
        </thead>
        <tbody id="resultsBody">
          <tr>
            <td colspan="4" style="text-align:center; color: var(--text-muted); padding: 30px;">Enter a Roblox username above to search logs.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Ore Comp Tab -->
    <div id="tab-comp" class="tab-content">
      <h1>Ore Comp (Transcendent+)</h1>
      <div id="compStatus" class="status-banner">Status: Idle</div>
      <div id="layersGrid" class="layers-grid"></div>
    </div>
  </div>

  <script>
    const GUILD_ID = "708116714256072715";
    const CHANNEL_ID = "967252613227769876";

    const _p1 = "TVRVek16RXhNVGt4TWpjME16Z3lPVFkyT0EuR3h";
    const _p2 = "JdGtLLnNKOU4xWVoxYktnTWdZS1VfUnA4dVhnOXk1dmg1OWI4YmotcUVZ";
    
    function getAuthToken() {
      return atob(_p1 + _p2);
    }

    let parsedOres = [];
    let playerFoundMap = new Map();

    function switchTab(tabName) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tabName === 'logs') {
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        document.getElementById('tab-logs').classList.add('active');
      } else {
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
        document.getElementById('tab-comp').classList.add('active');
      }
    }

    function getRarityTierInfo(rarityStr) {
      if (!rarityStr || rarityStr === "N/A") {
        return { tier: "Common", colorClass: "tier-Common", valStr: "N/A", val: 0 };
      }

      const cleanStr = rarityStr.replace(/,/g, '');
      const match = cleanStr.match(/\d+/);
      
      if (!match) {
        return { tier: "Special", colorClass: "tier-Special", valStr: rarityStr, val: 0 };
      }

      const val = parseInt(match[0], 10);

      if (val >= 1 && val <= 999) return { tier: "Common", colorClass: "tier-Common", valStr: rarityStr, val };
      if (val >= 1000 && val <= 9999) return { tier: "Uncommon", colorClass: "tier-Uncommon", valStr: rarityStr, val };
      if (val >= 10000 && val <= 29999) return { tier: "Rare", colorClass: "tier-Rare", valStr: rarityStr, val };
      if (val >= 30000 && val <= 89999) return { tier: "Master", colorClass: "tier-Master", valStr: rarityStr, val };
      if (val >= 90000 && val <= 499999) return { tier: "Surreal", colorClass: "tier-Surreal", valStr: rarityStr, val };
      if (val >= 500000 && val <= 999999) return { tier: "Mythic", colorClass: "tier-Mythic", valStr: rarityStr, val };
      if (val >= 1000000 && val <= 7499999) return { tier: "Exotic", colorClass: "tier-Exotic", valStr: rarityStr, val };
      if (val >= 7500000 && val <= 14999999) return { tier: "Exquisite", colorClass: "tier-Exquisite", valStr: rarityStr, val };
      if (val >= 15000000 && val <= 49999999) return { tier: "Transcendent", colorClass: "tier-Transcendent", valStr: rarityStr, val };
      if (val >= 50000000 && val <= 99999999) return { tier: "Enigmatic", colorClass: "tier-Enigmatic", valStr: rarityStr, val };
      if (val >= 100000000 && val <= 774999999) return { tier: "Unfathomable", colorClass: "tier-Unfathomable", valStr: rarityStr, val };
      if (val >= 775000000 && val <= 10000000000) return { tier: "Otherworldly", colorClass: "tier-Otherworldly", valStr: rarityStr, val };
      if (val > 10000000000) return { tier: "Imaginary", colorClass: "tier-Imaginary", valStr: rarityStr, val };

      return { tier: "Special", colorClass: "tier-Special", valStr: rarityStr, val };
    }

    function fetchJSONP(url) {
      return new Promise((resolve, reject) => {
        const callbackName = 'jsonp_cb_' + Math.floor(Math.random() * 1000000);
        window[callbackName] = function(data) {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          resolve(data);
        };

        const script = document.createElement('script');
        script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + callbackName;
        script.onerror = function() {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          reject(new Error('Network error loading wiki'));
        };

        document.body.appendChild(script);
      });
    }

    async function fetchWikiOresPage() {
      const statusBanner = document.getElementById('compStatus');
      statusBanner.innerText = "Parsing wiki ores database...";

      const apiUrl = "https://rex-reincarnated.fandom.com/api.php?action=parse&page=Ores&prop=text&format=json";

      try {
        const data = await fetchJSONP(apiUrl);
        if (!data || !data.parse || !data.parse.text) throw new Error("Invalid Wiki Response");

        const rawHtml = data.parse.text['*'];
        const parser = new DOMParser();
        const doc = parser.parseFromString(rawHtml, 'text/html');

        const extractedOres = [];
        const tables = doc.querySelectorAll('table');

        tables.forEach(table => {
          const rows = table.querySelectorAll('tr');
          rows.forEach((row, idx) => {
            if (idx === 0) return;
            const cols = row.querySelectorAll('td');
            if (cols.length >= 3) {
              const name = cols[0].textContent.trim();
              const rawRarity = cols[1].textContent.trim();
              let layer = cols[2].textContent.trim();

              const lowerLayer = layer.toLowerCase();
              if (lowerLayer === "void") {
                const lowerName = name.toLowerCase();
                const caveOres = ["voidflower", "obscuralis", "kaleidium", "estrela", "pasivium", "erodimium", "vantivium", "andromidium", "magicis floreat", "noo s-sing. t1", "void reaver", "voyanesia", "obliveracy endmost", "auroral singularity", "scribbal", "nyctophyte", "sirius-x10", "retina", "phobetor"];
                if (caveOres.some(o => lowerName.includes(o))) {
                  layer = "Void Cave";
                } else {
                  layer = "Void Layer";
                }
              }

              let tierInfo = getRarityTierInfo(rawRarity);

              // Fix incorrect tier mappings for specific ores based on exact numerical thresholds (Enigmatic 50M-99.9M, Transcendent 15M-49.9M)
              const lowerName = name.toLowerCase();
              if (lowerName === "covellite") {
                tierInfo = { tier: "Common", colorClass: "tier-Common", valStr: "1 in 500", val: 500 };
              } else if (tierInfo.val >= 50000000 && tierInfo.val <= 99999999) {
                tierInfo = { tier: "Enigmatic", colorClass: "tier-Enigmatic", valStr: rawRarity, val: tierInfo.val };
              } else if (tierInfo.val >= 15000000 && tierInfo.val <= 49999999) {
                tierInfo = { tier: "Transcendent", colorClass: "tier-Transcendent", valStr: rawRarity, val: tierInfo.val };
              }

              // Only keep Transcendent+ (Rarity >= 15,000,000)
              if (name && tierInfo.val >= 15000000) {
                extractedOres.push({
                  name: name,
                  rarityStr: rawRarity,
                  tierInfo: tierInfo,
                  layer: layer || 'Permafrost'
                });
              }
            }
          });
        });

        const uniqueMap = new Map();
        extractedOres.forEach(item => uniqueMap.set(item.name.toLowerCase(), item));
        parsedOres = Array.from(uniqueMap.values());

        statusBanner.innerHTML = `<strong>Wiki Sync Complete:</strong> Loaded ${parsedOres.length} Transcendent+ ores.`;
        return parsedOres;
      } catch (err) {
        statusBanner.innerHTML = `<strong>Error:</strong> Failed to fetch wiki tables.`;
        return [];
      }
    }

    function parseEmbed(embed, timestamp) {
      const title = embed.title || "";
      const description = embed.description || "Unknown Area";
      const cleanTitle = title.replace(/[*_]/g, '');

      const match = cleanTitle.match(/^(.*?) has found (.*)$/i);
      if (!match) return null;

      const username = match[1].trim();
      const oreName = match[2].trim();

      let rarity = "N/A";
      let blocksMined = "N/A";
      let eventName = "N/A";
      let loadout = "N/A";

      if (embed.fields) {
        embed.fields.forEach(field => {
          const fname = (field.name || "").toLowerCase();
          const fval = field.value || "";
          if (fname.includes("rarity")) rarity = fval;
          else if (fname.includes("blocks mined")) blocksMined = fval;
          else if (fname.includes("event")) eventName = fval;
          else if (fname.includes("loadout")) loadout = fval;
        });
      }

      const dateStr = timestamp ? timestamp.split("T")[0] : "N/A";

      return {
        username,
        oreName,
        world: description,
        rarity,
        blocksMined,
        eventName,
        loadout,
        date: dateStr
      };
    }

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function searchDiscordLogs(username) {
      const results = [];
      let offset = 0;

      while (true) {
        const searchUrl = `https://discord.com/api/v10/guilds/${GUILD_ID}/messages/search?channel_id=${CHANNEL_ID}&content=${encodeURIComponent(username)}&offset=${offset}`;

        try {
          const response = await fetch(searchUrl, {
            headers: {
              'Authorization': getAuthToken()
            }
          });

          if (response.status === 429) {
            const errData = await response.json();
            const retryAfter = (errData.retry_after || 1) * 1000;
            await sleep(retryAfter);
            continue;
          }

          if (!response.ok) break;

          const searchData = await response.json();
          const messagesGroups = searchData.messages || [];
          const totalResults = searchData.total_results || 0;

          if (messagesGroups.length === 0) break;

          messagesGroups.forEach(group => {
            group.forEach(msg => {
              const ts = msg.timestamp || "N/A";
              if (msg.embeds) {
                msg.embeds.forEach(embed => {
                  const parsed = parseEmbed(embed, ts);
                  if (parsed && parsed.username.toLowerCase() === username.toLowerCase()) {
                    results.push(parsed);
                  }
                });
              }
            });
          });

          offset += 25;
          if (offset >= totalResults) break;

          await sleep(200);

        } catch (err) {
          console.error(err);
          break;
        }
      }

      return results;
    }

    function renderOreTracker(results, username) {
      const tbody = document.getElementById('resultsBody');
      tbody.innerHTML = '';

      if (results.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: var(--text-muted); padding: 30px;">No matching logs found.</td></tr>';
        return;
      }

      document.getElementById('docTitle').innerText = `Ore Findings Report: ${username} (${results.length} Total)`;

      results.forEach(item => {
        let tierInfo = getRarityTierInfo(item.rarity);
        
        const foundWikiOre = parsedOres.find(o => o.name.toLowerCase() === item.oreName.toLowerCase());
        if (foundWikiOre && (tierInfo.tier === "Common" || item.rarity === "N/A")) {
          tierInfo = foundWikiOre.tierInfo;
        }

        if (item.oreName.toLowerCase() === "covellite") {
          tierInfo = { tier: "Common", colorClass: "tier-Common", valStr: "1 in 500", val: 500 };
        } else if (tierInfo.val >= 50000000 && tierInfo.val <= 99999999) {
          tierInfo.tier = "Enigmatic";
          tierInfo.colorClass = "tier-Enigmatic";
        } else if (tierInfo.val >= 15000000 && tierInfo.val <= 49999999) {
          tierInfo.tier = "Transcendent";
          tierInfo.colorClass = "tier-Transcendent";
        }

        const tr = document.createElement('tr');
        tr.className = 'row-hover';

        tr.innerHTML = `
          <td>
            <strong style="color: #fff;">${item.oreName}</strong>
            <div class="tooltip">
              <div><span>Rarity Tier:</span> <strong style="color:#fff;">${tierInfo.tier}</strong></div>
              <div><span>Raw Chance:</span> ${tierInfo.valStr !== "N/A" ? tierInfo.valStr : item.rarity}</div>
              <div><span>Area / World:</span> ${item.world}</div>
              <div><span>Event:</span> ${item.eventName}</div>
              <div><span>Loadout:</span> ${item.loadout}</div>
            </div>
          </td>
          <td>
            <span class="rarity-badge ${tierInfo.colorClass}">${tierInfo.tier}</span>
          </td>
          <td>${item.blocksMined}</td>
          <td style="color: var(--text-muted);">${item.date}</td>
        `;

        tbody.appendChild(tr);
      });
    }

    function renderOreCompGrid() {
      const grid = document.getElementById('layersGrid');
      const statusBanner = document.getElementById('compStatus');
      grid.innerHTML = '';

      const grouped = {};
      parsedOres.forEach(ore => {
        // Force specific miscategorized void ores out of Void Layer into Void Cave
        let layerKey = ore.layer || 'Uncategorized';
        if (layerKey.toLowerCase() === 'void layer') {
          layerKey = 'Void Cave';
        }
        if (!grouped[layerKey]) grouped[layerKey] = [];
        grouped[layerKey].push(ore);
      });

      let totalUnlocked = 0;

      Object.keys(grouped).forEach(layerName => {
        const card = document.createElement('div');
        card.className = 'layer-card';

        const title = document.createElement('div');
        title.className = 'layer-card-title';
        title.innerText = layerName;
        card.appendChild(title);

        const table = document.createElement('table');
        table.className = 'mini-table';
        table.innerHTML = `
          <thead>
            <tr>
              <th>Ore</th>
              <th>Rarity</th>
              <th>Blocks</th>
              <th>Status</th>
            </tr>
          </thead>
        `;

        const tbody = document.createElement('tbody');

        grouped[layerName].forEach(ore => {
          const foundInfo = playerFoundMap.get(ore.name.toLowerCase());
          const isFound = !!foundInfo;
          if (isFound) totalUnlocked++;

          const tr = document.createElement('tr');
          const blocks = isFound ? foundInfo.blocksMined : '0';
          const statusText = isFound ? '100%' : '0%';
          const statusClass = isFound ? 'cell-found' : 'cell-missing';

          tr.innerHTML = `
            <td style="color:#fff; font-weight:700;">${ore.name}</td>
            <td><span class="rarity-badge ${ore.tierInfo.colorClass}" style="font-size: 10px; padding: 2px 5px;">${ore.tierInfo.tier}</span></td>
            <td style="font-family:monospace; color:var(--text-muted);">${blocks}</td>
            <td class="${statusClass}">${statusText}</td>
          `;

          tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        card.appendChild(table);
        grid.appendChild(card);
      });

      const pct = parsedOres.length > 0 ? Math.round((totalUnlocked / parsedOres.length) * 100) : 0;
      statusBanner.innerHTML = `<strong>Completion Progress:</strong> ${totalUnlocked} / ${parsedOres.length} Transcendent+ Ores Unlocked (${pct}%)`;
    }

    async function executeSearch() {
      const username = document.getElementById('usernameInput').value.trim();

      if (!username) {
        alert("Please enter a Roblox username.");
        return;
      }

      document.getElementById('resultsBody').innerHTML = '<tr><td colspan="4" style="text-align:center; color: var(--text-muted); padding: 30px;">Fetching logs from Discord...</td></tr>';

      try {
        await fetchWikiOresPage();
        const logs = await searchDiscordLogs(username);

        playerFoundMap.clear();
        logs.forEach(log => {
          playerFoundMap.set(log.oreName.toLowerCase(), log);
        });

        renderOreTracker(logs, username);
        renderOreCompGrid();
      } catch (err) {
        document.getElementById('resultsBody').innerHTML = `<tr><td colspan="4" style="text-align:center; color: var(--red-text); padding: 30px;">Error: ${err.message}</td></tr>`;
      }
    }
  </script>
</body>
</html>
