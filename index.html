<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>REx: Reincarnated - Live Wiki Tracker</title>
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #161922;
      --border-color: #2a2e3d;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green-bg: rgba(35, 165, 90, 0.15);
      --green-border: #23a55a;
      --red-bg: rgba(237, 66, 69, 0.15);
      --red-border: #da373c;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .nav-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 900px;
    }

    .nav-btn {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      background-color: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
    }

    .nav-btn.active {
      background-color: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .config-box {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      padding: 16px 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-sizing: border-box;
      align-items: flex-end;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    input {
      padding: 10px 14px;
      font-size: 14px;
      background-color: #0b0c10;
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 6px;
      outline: none;
    }

    button.action-btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      height: 38px;
    }

    .doc-page {
      background: var(--card-bg);
      width: 100%;
      max-width: 900px;
      min-height: 600px;
      padding: 35px 40px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-sizing: border-box;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border-bottom: 1px solid var(--border-color);
      padding: 12px 14px;
      text-align: left;
      font-size: 14px;
    }

    .status-banner {
      background: #1c3b5e;
      border: 1px solid #4752c4;
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <button class="nav-btn active" onclick="switchTab('logs')">Ore Finding Logs</button>
    <button class="nav-btn" onclick="switchTab('comp')">Wiki Live Comp</button>
  </div>

  <div class="config-box">
    <div class="input-group">
      <label for="usernameInput">Roblox Username</label>
      <input type="text" id="usernameInput" placeholder="Enter username...">
    </div>
    <button class="action-btn" onclick="executeSearch()">Fetch Logs & Wiki</button>
  </div>

  <div class="doc-page">
    <div id="tab-logs" class="tab-content active">
      <h1 id="docTitle">Ore Findings Report</h1>
      <table>
        <thead>
          <tr>
            <th>Ore Name</th>
            <th>Rarity / Layer</th>
            <th>Blocks Mined</th>
            <th>Date Found</th>
          </tr>
        </thead>
        <tbody id="resultsBody">
          <tr>
            <td colspan="4" style="text-align:center; color: var(--text-muted); padding: 30px;">Enter a Roblox username to query findings.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div id="tab-comp" class="tab-content">
      <h1>Live Fandom Wiki Sync</h1>
      <div id="wikiSyncStatus" class="status-banner">Status: Idle</div>
      <div id="wikiContainer"></div>
    </div>
  </div>

  <script>
    function switchTab(tabName) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tabName === 'logs') {
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        document.getElementById('tab-logs').classList.add('active');
      } else {
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
        document.getElementById('tab-comp').classList.add('active');
      }
    }

    // Dynamic Wiki Data Scraper using AllOrigins CORS Proxy
    async function fetchLiveWikiLayers() {
      const statusBanner = document.getElementById('wikiSyncStatus');
      statusBanner.innerText = "Status: Syncing with rex-reincarnated.fandom.com/wiki/Layers...";

      const targetUrl = encodeURIComponent("https://rex-reincarnated.fandom.com/wiki/Layers");
      const proxyUrl = `https://api.allorigins.win/get?url=${targetUrl}`;

      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error("Network response failed");
        
        const data = await response.json();
        const parser = new DOMParser();
        const doc = parser.parseFromString(data.contents, 'text/html');

        // Extract layer titles/links directly from Fandom markup
        const links = doc.querySelectorAll('.mw-parser-output a');
        const layersFound = new Set();

        links.forEach(link => {
          const title = link.getAttribute('title') || '';
          if (title.includes('Layer')) {
            layersFound.add(title);
          }
        });

        statusBanner.innerHTML = `<strong>Wiki Sync Complete:</strong> Successfully retrieved ${layersFound.size} Layer entries directly from Fandom.`;
        return Array.from(layersFound);
      } catch (err) {
        statusBanner.innerHTML = `<strong style="color:var(--red-border);">Wiki Sync Error:</strong> Failed to bypass CORS. ${err.message}`;
        return [];
      }
    }

    async function executeSearch() {
      const username = document.getElementById('usernameInput').value.trim();
      if (!username) {
        alert("Please enter a username.");
        return;
      }

      // Fetch dynamic wiki entries
      const wikiLayers = await fetchLiveWikiLayers();
      
      const container = document.getElementById('wikiContainer');
      container.innerHTML = '<h3>Retrieved Wiki Layer Categories:</h3>';

      const ul = document.createElement('ul');
      wikiLayers.forEach(layer => {
        const li = document.createElement('li');
        li.innerText = layer;
        ul.appendChild(li);
      });
      container.appendChild(ul);
    }
  </script>
</body>
</html>
