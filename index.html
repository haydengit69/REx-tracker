<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>REx: Reincarnated - Logs & Completion Tracker</title>
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #161922;
      --border-color: #2a2e3d;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green-bg: rgba(35, 165, 90, 0.15);
      --green-border: #23a55a;
      --red-bg: rgba(237, 66, 69, 0.15);
      --red-border: #da373c;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .nav-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 900px;
    }

    .nav-btn {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      background-color: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
    }

    .nav-btn.active {
      background-color: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .config-box {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      padding: 16px 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-sizing: border-box;
      align-items: flex-end;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    input {
      padding: 10px 14px;
      font-size: 14px;
      background-color: #0b0c10;
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 6px;
      outline: none;
    }

    button.action-btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      height: 38px;
    }

    .doc-page {
      background: var(--card-bg);
      width: 100%;
      max-width: 900px;
      min-height: 600px;
      padding: 35px 40px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-sizing: border-box;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border-bottom: 1px solid var(--border-color);
      padding: 12px 14px;
      text-align: left;
      font-size: 14px;
    }

    .status-banner {
      background: #1c3b5e;
      border: 1px solid #4752c4;
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 13px;
    }

    .comp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .comp-item {
      background: #0b0c10;
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <button class="nav-btn active" onclick="switchTab('logs')">Ore Finding Logs</button>
    <button class="nav-btn" onclick="switchTab('comp')">Ore Comp</button>
  </div>

  <div class="config-box">
    <div class="input-group">
      <label for="usernameInput">Roblox Username</label>
      <input type="text" id="usernameInput" placeholder="Enter username...">
    </div>
    <button class="action-btn" onclick="executeSearch()">Search Logs & Load Comp</button>
  </div>

  <div class="doc-page">
    <div id="tab-logs" class="tab-content active">
      <h1 id="docTitle">Ore Findings Report</h1>
      <table>
        <thead>
          <tr>
            <th>Ore Name</th>
            <th>Rarity / Layer</th>
            <th>Blocks Mined</th>
            <th>Date Found</th>
          </tr>
        </thead>
        <tbody id="resultsBody">
          <tr>
            <td colspan="4" style="text-align:center; color: var(--text-muted); padding: 30px;">Enter a Roblox username to query findings.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div id="tab-comp" class="tab-content">
      <h1>Ore Comp</h1>
      <div id="compStatus" class="status-banner">Status: Idle</div>
      <div id="compContainer" class="comp-grid"></div>
    </div>
  </div>

  <script>
    function switchTab(tabName) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tabName === 'logs') {
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        document.getElementById('tab-logs').classList.add('active');
      } else {
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
        document.getElementById('tab-comp').classList.add('active');
      }
    }

    // JSONP Handler to bypass CORS limits on GitHub Pages
    function fetchJSONP(url) {
      return new Promise((resolve, reject) => {
        const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
        window[callbackName] = function(data) {
          delete window[callbackName];
          document.body.removeChild(script);
          resolve(data);
        };

        const script = document.createElement('script');
        script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + callbackName;
        script.onerror = function() {
          delete window[callbackName];
          document.body.removeChild(script);
          reject(new Error('JSONP request failed'));
        };

        document.body.appendChild(script);
      });
    }

    async function fetchCompData() {
      const statusBanner = document.getElementById('compStatus');
      statusBanner.innerText = "Status: Loading Ore Comp data...";

      // Fandom MediaWiki API endpoint using JSONP
      const apiUrl = "https://rex-reincarnated.fandom.com/api.php?action=query&list=categorymembers&cmtitle=Category:Ores&cmlimit=500&format=json";

      try {
        const data = await fetchJSONP(apiUrl);
        if (data && data.query && data.query.categorymembers) {
          const items = data.query.categorymembers.map(m => m.title);
          statusBanner.innerHTML = `<strong>Ore Comp Loaded:</strong> Successfully fetched ${items.length} entries.`;
          return items;
        } else {
          throw new Error("Invalid response structure");
        }
      } catch (err) {
        statusBanner.innerHTML = `<strong style="color:var(--red-border);">Ore Comp Error:</strong> Unable to retrieve live entries (${err.message}).`;
        return [];
      }
    }

    async function executeSearch() {
      const username = document.getElementById('usernameInput').value.trim();
      if (!username) {
        alert("Please enter a username.");
        return;
      }

      const compItems = await fetchCompData();
      const container = document.getElementById('compContainer');
      container.innerHTML = '';

      compItems.forEach(item => {
        const div = document.createElement('div');
        div.className = 'comp-item';
        div.innerText = item;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
