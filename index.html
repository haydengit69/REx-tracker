<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>REx: Reincarnated - Logs & Ore Comp</title>
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #161922;
      --border-color: #2a2e3d;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --green-bg: rgba(35, 165, 90, 0.15);
      --green-border: #23a55a;
      --red-bg: rgba(237, 66, 69, 0.15);
      --red-border: #da373c;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .nav-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 900px;
    }

    .nav-btn {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      background-color: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
    }

    .nav-btn.active {
      background-color: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .config-box {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      padding: 16px 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-sizing: border-box;
      align-items: flex-end;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    input {
      padding: 10px 14px;
      font-size: 14px;
      background-color: #0b0c10;
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 6px;
      outline: none;
    }

    button.action-btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      height: 38px;
    }

    .doc-page {
      background: var(--card-bg);
      width: 100%;
      max-width: 900px;
      min-height: 600px;
      padding: 35px 40px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-sizing: border-box;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border-bottom: 1px solid var(--border-color);
      padding: 12px 14px;
      text-align: left;
      font-size: 14px;
    }

    .status-banner {
      background: #1c3b5e;
      border: 1px solid #4752c4;
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .comp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }

    .comp-card {
      padding: 14px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-sizing: border-box;
    }

    .comp-card.found {
      background-color: var(--green-bg);
      border: 1px solid var(--green-border);
    }

    .comp-card.missing {
      background-color: var(--red-bg);
      border: 1px solid var(--red-border);
    }

    .comp-name {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }

    .comp-detail {
      font-size: 12px;
      color: var(--text-muted);
    }

    .comp-badge {
      display: inline-block;
      align-self: flex-start;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .comp-card.found .comp-badge {
      background: var(--green-border);
      color: #fff;
    }

    .comp-card.missing .comp-badge {
      background: var(--red-border);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <button class="nav-btn active" onclick="switchTab('logs')">Ore Finding Logs</button>
    <button class="nav-btn" onclick="switchTab('comp')">Ore Comp</button>
  </div>

  <div class="config-box">
    <div class="input-group">
      <label for="usernameInput">Roblox Username</label>
      <input type="text" id="usernameInput" placeholder="Enter username...">
    </div>
    <button class="action-btn" onclick="executeSearch()">Search Logs & Ore Comp</button>
  </div>

  <div class="doc-page">
    <div id="tab-logs" class="tab-content active">
      <h1 id="docTitle">Ore Findings Report</h1>
      <table>
        <thead>
          <tr>
            <th>Ore Name</th>
            <th>Rarity / Layer</th>
            <th>Blocks Mined</th>
            <th>Date Found</th>
          </tr>
        </thead>
        <tbody id="resultsBody">
          <tr>
            <td colspan="4" style="text-align:center; color: var(--text-muted); padding: 30px;">Enter a Roblox username to query findings.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div id="tab-comp" class="tab-content">
      <h1>Ore Comp (Exotic+)</h1>
      <div id="compStatus" class="status-banner">Status: Idle</div>
      <div id="compContainer" class="comp-grid"></div>
    </div>
  </div>

  <script>
    let parsedExoticOres = [];
    let playerFoundOres = new Set();

    function switchTab(tabName) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tabName === 'logs') {
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        document.getElementById('tab-logs').classList.add('active');
      } else {
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
        document.getElementById('tab-comp').classList.add('active');
      }
    }

    // Dynamic JSONP fetcher bypassing CORS
    function fetchJSONP(url) {
      return new Promise((resolve, reject) => {
        const callbackName = 'jsonp_cb_' + Math.floor(Math.random() * 1000000);
        window[callbackName] = function(data) {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          resolve(data);
        };

        const script = document.createElement('script');
        script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + callbackName;
        script.onerror = function() {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          reject(new Error('Network error loading wiki content'));
        };

        document.body.appendChild(script);
      });
    }

    // Helper to parse numeric rarity strings (e.g. "1 in 250,000" or "250000")
    function parseRarityValue(str) {
      if (!str) return 0;
      const cleanStr = str.replace(/,/g, '');
      const match = cleanStr.match(/\d+/g);
      if (!match) return 0;
      return parseInt(match[match.length - 1], 10);
    }

    // Fetches and parses the main "Ores" page live tables directly from MediaWiki
    async function fetchWikiOresPage() {
      const statusBanner = document.getElementById('compStatus');
      statusBanner.innerText = "Status: Parsing live tables from wiki Ores page...";

      const apiUrl = "https://rex-reincarnated.fandom.com/api.php?action=parse&page=Ores&prop=text&format=json";

      try {
        const data = await fetchJSONP(apiUrl);
        if (!data || !data.parse || !data.parse.text) {
          throw new Error("Unable to read wiki page text");
        }

        const rawHtml = data.parse.text['*'];
        const parser = new DOMParser();
        const doc = parser.parseFromString(rawHtml, 'text/html');

        const extractedOres = [];
        const tables = doc.querySelectorAll('table');

        tables.forEach(table => {
          const rows = table.querySelectorAll('tr');
          rows.forEach((row, index) => {
            if (index === 0) return; // Skip headers

            const cols = row.querySelectorAll('td');
            if (cols.length >= 3) {
              const name = cols[0].textContent.trim();
              const rawRarity = cols[1].textContent.trim();
              const layer = cols[2].textContent.trim();
              const rarityNum = parseRarityValue(rawRarity);

              // Filter for Exotic+ (Rarity threshold 250,000+)
              if (name && rarityNum >= 250000) {
                extractedOres.push({
                  name: name,
                  rarity: rawRarity.includes('in') ? rawRarity : `1 in ${Number(rawRarity).toLocaleString()}`,
                  layer: layer || 'Unknown Layer',
                  rarityValue: rarityNum
                });
              }
            }
          });
        });

        // Deduplicate and sort by rarity descending
        const uniqueMap = new Map();
        extractedOres.forEach(item => uniqueMap.set(item.name.toLowerCase(), item));
        
        parsedExoticOres = Array.from(uniqueMap.values()).sort((a, b) => b.rarityValue - a.rarityValue);

        statusBanner.innerHTML = `<strong>Ore Comp Loaded:</strong> Successfully parsed ${parsedExoticOres.length} Exotic+ entries from the wiki page.`;
        return parsedExoticOres;
      } catch (err) {
        statusBanner.innerHTML = `<strong style="color:var(--red-border);">Ore Comp Error:</strong> ${err.message}`;
        return [];
      }
    }

    function renderOreComp() {
      const container = document.getElementById('compContainer');
      const statusBanner = document.getElementById('compStatus');
      container.innerHTML = '';

      if (parsedExoticOres.length === 0) {
        container.innerHTML = '<div style="color: var(--text-muted); grid-column: 1/-1;">No entries fetched yet.</div>';
        return;
      }

      let foundCount = 0;

      parsedExoticOres.forEach(ore => {
        const isFound = playerFoundOres.has(ore.name.toLowerCase());
        if (isFound) foundCount++;

        const card = document.createElement('div');
        card.className = `comp-card ${isFound ? 'found' : 'missing'}`;

        card.innerHTML = `
          <div class="comp-name">${ore.name}</div>
          <div class="comp-detail"><strong>Rarity:</strong> ${ore.rarity}</div>
          <div class="comp-detail"><strong>Layer:</strong> ${ore.layer}</div>
          <div class="comp-badge">${isFound ? 'UNLOCKED' : 'LOCKED'}</div>
        `;

        container.appendChild(card);
      });

      statusBanner.innerHTML = `<strong>Completion Progress:</strong> ${foundCount} / ${parsedExoticOres.length} Exotics+ Unlocked (${Math.round((foundCount / parsedExoticOres.length) * 100)}%)`;
    }

    async function executeSearch() {
      const username = document.getElementById('usernameInput').value.trim();
      if (!username) {
        alert("Please enter a username.");
        return;
      }

      // Fetch live table entries directly from wiki Ores page
      await fetchWikiOresPage();

      const resultsBody = document.getElementById('resultsBody');
      resultsBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color: var(--text-muted); padding: 30px;">Loading logs for ${username}...</td></tr>`;

      // Render updated visual cards
      renderOreComp();
    }
  </script>
</body>
</html>
